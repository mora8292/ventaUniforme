<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Escuela</title>
    <link rel="stylesheet" href="../../assets/css/administrador.css">
</head>

<body>

    <div class="main">
        <div class="form-card">
            <h2>Editar Escuela</h2>

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="nombre">
            </div>

            <div class="form-group">
                <label>Nivel</label>
                <select id="grado">
                    <option value="Primaria">Primaria</option>
                    <option value="Secundaria">Secundaria</option>
                    <option value="Preparatoria">Preparatoria</option>
                </select>
            </div>

            <div class="form-group">
                <label>Imagen actual</label>
                <img id="preview" style="width:160px; border-radius:10px; display:block; margin-bottom:10px;">
                <input type="file" id="imagen" accept="image/*">
            </div>

            <div class="form-buttons">
                <button class="btn-guardar" id="btnGuardar">Guardar</button>
                <button class="btn-cancelar" onclick="cancelar()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const logged = localStorage.getItem("logged");
        const rol = localStorage.getItem("rol");

        if (!logged || rol !== "1") {
            window.location.href = "../../login.html";
        }

        function cancelar() {
            window.location.href = "./escuelas.html";
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBj0V13o71naoJlqfDdah5Ob1I-cZskp8M",
            authDomain: "uniformes-calpus.firebaseapp.com",
            projectId: "uniformes-calpus",
            storageBucket: "uniformes-calpus.firebasestorage.app",
            messagingSenderId: "134191574166",
            appId: "1:134191574166:web:130c593447ffc5bfca26b7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        let imgActual = "";

        function convertirAWebp(file) {
            return new Promise((resolve) => {
                const img = new Image();
                const reader = new FileReader();

                reader.onload = (e) => img.src = e.target.result;

                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const ctx = canvas.getContext("2d");

                    canvas.width = 460;
                    canvas.height = 390;

                    ctx.drawImage(img, 0, 0, 460, 390);

                    canvas.toBlob((blob) => resolve(blob), "image/webp", 0.8);
                };

                reader.readAsDataURL(file);
            });
        }

        async function cargarEscuela() {
            const snap = await getDoc(doc(db, "escuelas", id));
            const data = snap.data();

            document.getElementById("nombre").value = data.nombre || "";
            document.getElementById("grado").value = data.grado || "Primaria";

            imgActual = data.imgUrl || "";
            document.getElementById("preview").src = imgActual;
        }

        document.getElementById("btnGuardar").addEventListener("click", async () => {
            const nombre = document.getElementById("nombre").value.trim();
            const grado = document.getElementById("grado").value;
            const file = document.getElementById("imagen").files[0];

            if (!nombre) {
                alert("Completa los campos");
                return;
            }

            let imgUrl = imgActual;

            if (file) {
                const webpBlob = await convertirAWebp(file);
                const storageRef = ref(storage, "escuelas/" + Date.now() + ".webp");

                await uploadBytes(storageRef, webpBlob, {
                    contentType: "image/webp"
                });

                imgUrl = await getDownloadURL(storageRef);
            }

            await updateDoc(doc(db, "escuelas", id), {
                nombre,
                grado,
                imgUrl
            });

            alert("Actualizado");
            window.location.href = "./escuelas.html";
        });

        cargarEscuela();
    </script>

</body>

</html>
