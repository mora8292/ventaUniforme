<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Inventario</title>
    <link rel="stylesheet" href="../../assets/css/administrador.css">
</head>

<body>

    <div class="main">
        <div class="form-card">
            <h2>Editar Inventario</h2>

            <div class="form-group">
                <label>Uniforme</label>
                <input type="text" id="nombre">
            </div>

            <div class="form-group">
                <label>Talla</label>
                <select id="talla">
                    <option value="CH">CH</option>
                    <option value="M">M</option>
                    <option value="G">G</option>
                    <option value="XG">XG</option>
                </select>
            </div>

            <div class="form-group">
                <label>Imagen actual</label>
                <img id="preview" style="width:120px; border-radius:10px; display:block; margin-bottom:10px;">
                <input type="file" id="imagen" accept="image/*">
            </div>

            <div class="form-group">
                <label>Stock</label>
                <input type="number" id="stock">
            </div>

            <div class="form-group">
                <label>Precio Unitario</label>
                <input type="number" id="precio">
            </div>

            <div class="form-buttons">
                <button class="btn-guardar" id="btnGuardar">Guardar</button>
                <button class="btn-cancelar" onclick="cancelar()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const logged = localStorage.getItem("logged");
        const rol = localStorage.getItem("rol");

        if (!logged || rol !== "1") {
            window.location.href = "../../login.html";
        }

        function cancelar() {
            window.location.href = "./inventario.html";
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBj0V13o71naoJlqfDdah5Ob1I-cZskp8M",
            authDomain: "uniformes-calpus.firebaseapp.com",
            projectId: "uniformes-calpus",
            storageBucket: "uniformes-calpus.firebasestorage.app",
            messagingSenderId: "134191574166",
            appId: "1:134191574166:web:130c593447ffc5bfca26b7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        let imgActual = "";

        function convertirAWebp(file) {
            return new Promise((resolve) => {
                const img = new Image();
                const reader = new FileReader();

                reader.onload = (e) => img.src = e.target.result;

                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const ctx = canvas.getContext("2d");

                    canvas.width = 225;
                    canvas.height = 225;

                    ctx.drawImage(img, 0, 0, 225, 225);

                    canvas.toBlob((blob) => resolve(blob), "image/webp", 0.8);
                };

                reader.readAsDataURL(file);
            });
        }

        async function cargar() {
            const docSnap = await getDoc(doc(db, "productos", id));
            const data = docSnap.data();

            document.getElementById("nombre").value = data.nombre;
            document.getElementById("stock").value = data.stock;
            document.getElementById("talla").value = data.talla || "CH";
            document.getElementById("precio").value = data.precioUnitario ?? 0;

            imgActual = data.imgUrl || "";
            document.getElementById("preview").src = imgActual;
        }

        document.getElementById("btnGuardar").addEventListener("click", async () => {
            const nombre = document.getElementById("nombre").value.trim();
            const stock = parseInt(document.getElementById("stock").value);
            const talla = document.getElementById("talla").value;
            const precioUnitario = parseFloat(document.getElementById("precio").value);
            const file = document.getElementById("imagen").files[0];

            if (!nombre || isNaN(stock) || isNaN(precioUnitario)) {
                alert("Completa los campos correctamente");
                return;
            }

            let imgUrl = imgActual;

            if (file) {
                const webpBlob = await convertirAWebp(file);
                const storageRef = ref(storage, "productos/" + Date.now() + ".webp");

                await uploadBytes(storageRef, webpBlob, {
                    contentType: "image/webp"
                });

                imgUrl = await getDownloadURL(storageRef);
            }

            await updateDoc(doc(db, "productos", id), {
                nombre,
                stock,
                talla,
                precioUnitario,
                imgUrl
            });

            alert("Actualizado");
            window.location.href = "./inventario.html";
        });

        cargar();
    </script>

</body>

</html>
